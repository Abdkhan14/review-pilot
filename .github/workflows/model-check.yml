name: Model availability check

# Runs weekly so we get advance warning before a model shutdown.
# OpenAI gives at least 6 months notice for GA models, so weekly is
# enough to catch it well before it becomes a production outage.
on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 09:00 UTC
  workflow_dispatch:     # Also runnable manually from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check configured OpenAI models
        run: npm run check-models
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Mirror whatever is set in production. If these secrets aren't
          # configured, the script falls back to the same defaults as the app.
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_FALLBACK_MODELS: ${{ secrets.OPENAI_FALLBACK_MODELS }}
